dependencies:
  # Pinned exactly, not `^0.0.83`: this is the runtime the shipped .app embeds,
  # and a caret would let a build pick up a different one without the bundle
  # being rebuilt against it.
  #
  # 0.0.84 is the first release built against a current macOS SDK. AppKit reads
  # the SDK out of LC_BUILD_VERSION to decide how to draw a window's controls,
  # so every release up to 0.0.83 — built on a macos-15 runner — gave this app
  # pre-macOS-26 traffic lights, and nothing on this side could reach that.
  # `scripts/build-desktop-app.ts` warns if the runtime it bundles regresses.
  #
  # 0.0.83 carried the menu fix — an item declared by role alone is built rather
  # than silently skipped. Nothing here depends on it, since @stacksjs/desktop
  # sends an id on every item as of 0.2.249, so it is defence in depth for
  # hand-written payloads. (0.0.82 does not exist as far as pantry is concerned:
  # its release shipped without the macOS binaries.)
  #
  # 0.0.87 carries the two things this app's window is built on:
  #
  #   `--web-window-material`, one NSVisualEffectView behind the whole web view
  #   instead of a 74pt strip with an opaque column beside it. The rail has no
  #   fill of its own, so that strip's trailing edge was the only hard line in
  #   the window. The launcher probes for the flag and falls back to
  #   `--web-sidebar-material` on an older runtime, so a downgrade is plain
  #   rather than broken.
  #
  #   `--craft-window-buttons-*`, the traffic lights' own rectangle. 0.0.86
  #   widened `--craft-window-controls-*` to span Craft's toolbar row as well,
  #   which is right for a page clearing that corner and wrong for the rail,
  #   which the row overhangs and never reaches. The rail and the top strip
  #   both read the buttons now.
  #
  # 0.0.86 carried the window-chrome reserve fix that made the second of those
  # necessary: the runtime reported the room to leave as the traffic lights
  # alone, when its own toolbar row beside them reaches about 180pt further.
  # See craft f694324 and 057eda9.
  craft-native.org: ^0.0.87
  bun.sh: ^1.3.14
