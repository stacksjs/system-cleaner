# Which difference stops Craft opening a window for this app on Windows.
#
# Temporary, and deliberately not part of `ci.yml`: it answers one question for
# craft-native/craft#342 and should be deleted once it has.
#
# The question: craft's own `windows-multi-window` job passes on an unpatched
# build, while this app's bundle gets `CO_E_NOTINITIALIZED` and no window. The
# loader is byte-identical in both cases and the build flags match, so what is
# left is the invocation — craft's CI runs `craft.exe --url <u>`, this app runs
# `craft.exe <u> --title … --persistent-storage --width … --height …
# --no-devtools` — or the build host, which this job cannot vary.
#
# So: take the exact binary the bundle downloads, and try both invocations and
# the flags between them. `scripts/windows-webview-probe.ts` reports every case
# and fails none of them; the result is the table in the job summary.
name: Windows WebView2 experiment

on:
  workflow_dispatch:
  push:
    branches:
      - exp/windows-webview-com

permissions:
  contents: read

jobs:
  probe:
    name: Probe craft invocations
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # v0.0.100 is what `scripts/build-desktop-windows.ts` downloads, because
      # deps.yaml declares ^0.0.90 and MIN_WINDOWS_CRAFT floors it at 100 (the
      # v0.0.90 archive ships no WebView2Loader.dll). v0.0.142 is current, and
      # is here to show whether any of this is version-dependent.
      #
      # Each archive extracts into its own directory: craft.exe loads
      # WebView2Loader.dll from beside itself, so two versions sharing a
      # directory would not be testing what they claim to.
      - name: Fetch the shipped Craft runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in 'v0.0.100', 'v0.0.142') {
            $dir = Join-Path $env:RUNNER_TEMP "craft-$version"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP "craft-$version.zip"
            Invoke-WebRequest -Uri "https://github.com/craft-native/craft/releases/download/$version/craft-windows-x64.zip" -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
            Write-Host "--- $version"
            Get-ChildItem $dir | ForEach-Object { Write-Host "    $($_.Name)  $($_.Length) bytes" }
            $loader = Join-Path $dir 'WebView2Loader.dll'
            if (Test-Path $loader) {
              Write-Host "    loader sha256 $((Get-FileHash $loader -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
          }

      # The same key the bundle's own CI reads. A missing runtime would explain
      # every failure below and mean none of them are about COM.
      - name: WebView2 runtime on this machine
        shell: pwsh
        run: |
          $wv = Get-ItemProperty -ErrorAction SilentlyContinue `
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if ($wv) { Write-Host "WebView2 runtime $($wv.pv)" } else { Write-Host '::error::no WebView2 runtime' }

      - name: Probe v0.0.100 (the version the bundle ships)
        run: bun scripts/windows-webview-probe.ts --exe "$env:RUNNER_TEMP/craft-v0.0.100/craft.exe" --label v0.0.100
        shell: pwsh

      - name: Probe v0.0.142 (current)
        run: bun scripts/windows-webview-probe.ts --exe "$env:RUNNER_TEMP/craft-v0.0.142/craft.exe" --label v0.0.142
        shell: pwsh

      # Round two. Round one found every argument list works, which leaves how
      # `app/Desktop/launcher.ts` spawns craft: inherited stdio, windowsHide,
      # and a GUI-subsystem parent that owns no console.
      - name: Spawn probe, v0.0.100
        run: bun scripts/windows-webview-spawn-probe.ts --exe "$env:RUNNER_TEMP/craft-v0.0.100/craft.exe" --label v0.0.100
        shell: pwsh

      # The bundle renames craft.exe to craft-runtime.exe and stands it in a
      # directory of its own. Cheap to rule out, and expensive to overlook.
      - name: Spawn probe, staged as craft-runtime.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'staged'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$env:RUNNER_TEMP/craft-v0.0.100/craft.exe" (Join-Path $stage 'craft-runtime.exe')
          Copy-Item "$env:RUNNER_TEMP/craft-v0.0.100/WebView2Loader.dll" $stage
          bun scripts/windows-webview-spawn-probe.ts --exe (Join-Path $stage 'craft-runtime.exe') --label craft-runtime

  # Round three: does the patch actually clear it.
  #
  # Rounds one and two found the trigger — `CREATE_NO_WINDOW` alone turns a
  # working webview into CO_E_NOTINITIALIZED — and that craft never puts the
  # thread in an apartment itself. craft-native/craft#342 adds the
  # `CoInitializeEx` call. Everything so far says it should fix this; nothing
  # so far has run it.
  #
  # So build craft twice from source on one machine, from commits one apart:
  # the patch, and its parent. Same toolchain, same flags, same loader, same
  # runner — the only variable is the commit. Then run round two's spawn table
  # against both.
  #
  # craft is checked out at the workspace root rather than a subdirectory
  # because its own `first-party-zig-deps` action resolves the sibling
  # packages relative to GITHUB_WORKSPACE, and the point of using that action
  # is to build the way craft's own CI does, at the revisions it pins.
  from-source:
    name: Patched vs unpatched, from source
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the patched branch
        uses: actions/checkout@v4
        with:
          repository: glennmichael123/craft
          ref: fix/windows-com-init
          # The patch and its parent. The A/B needs both.
          fetch-depth: 2

      - name: Check out this repository for the probe
        uses: actions/checkout@v4
        with:
          path: sc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The same action and version craft's own Windows job uses, so the Zig
      # that builds this is the Zig that builds theirs.
      - name: Setup Pantry (provides Zig)
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce # v0.11.66
        with:
          version: '0.11.64'

      - name: First-party Zig dependencies
        uses: ./.github/actions/first-party-zig-deps

      # The WebView2 loader craft ships, so neither build is tested against a
      # different one than round two used.
      - name: Stage the shipped WebView2 loader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'craft-release.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'craft-release'
          Invoke-WebRequest -Uri 'https://github.com/craft-native/craft/releases/download/v0.0.142/craft-windows-x64.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $loader = Join-Path $dir 'WebView2Loader.dll'
          Write-Host "loader sha256 $((Get-FileHash $loader -Algorithm SHA256).Hash.ToLowerInvariant())"
          "LOADER=$loader" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build both commits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The pantry shim can report a version but cannot locate Zig's lib
          # directory during a build, which is craft's own note in ci.yml. Run
          # the package binary itself.
          $zig = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'pantry') -Filter zig.exe -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $zig) { throw 'no zig.exe under pantry/' }
          Write-Host "zig: $zig"
          & $zig version

          $head = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD~1).Trim()
          Write-Host "patched:   $head"
          Write-Host "unpatched: $parent"
          Write-Host '--- the only difference between the two builds ---'
          git diff --stat HEAD~1 HEAD

          function Build($commit, $label) {
            Write-Host "::group::build $label ($commit)"
            git -c advice.detachedHead=false checkout --quiet $commit
            Push-Location (Join-Path $env:GITHUB_WORKSPACE 'packages/zig')
            try {
              & $zig build -Doptimize=ReleaseSafe -Dcpu=baseline
              if ($LASTEXITCODE -ne 0) { throw "$label build failed with $LASTEXITCODE" }
            }
            finally { Pop-Location }
            $dest = Join-Path $env:RUNNER_TEMP $label
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'packages/zig/zig-out/bin/craft.exe') (Join-Path $dest 'craft.exe')
            Copy-Item $env:LOADER $dest
            # Whether the symbol is in the binary at all, so a mislabelled pair
            # cannot be mistaken for a result.
            $exe = Join-Path $dest 'craft.exe'
            $found = bun -e "const b = Buffer.from(await Bun.file(process.argv[1]).arrayBuffer()); console.log(b.includes('CoInitializeEx') ? 'yes' : 'no')" $exe
            Write-Host "$label : craft.exe references CoInitializeEx: $found"
            Write-Host '::endgroup::'
          }

          # Control first, so the log reads in the order the argument runs.
          Build $parent 'unpatched'
          Build $head 'patched'

      - name: Spawn table, unpatched (the control)
        shell: pwsh
        run: bun sc/scripts/windows-webview-spawn-probe.ts --exe "$env:RUNNER_TEMP/unpatched/craft.exe" --label from-source-unpatched

      - name: Spawn table, patched
        shell: pwsh
        run: bun sc/scripts/windows-webview-spawn-probe.ts --exe "$env:RUNNER_TEMP/patched/craft.exe" --label from-source-patched
