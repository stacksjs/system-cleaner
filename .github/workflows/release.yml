name: Releaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # The only build artifact. Every workspace package is `private: true`,
      # so there is nothing to publish to npm.
      - name: Build binaries
        run: bun run build:binaries

      # The Action owns the whole release: it creates the GitHub release,
      # extracts this tag's section from CHANGELOG.md (written by
      # `buddy release`), attaches the binaries, and generates checksums.
      - name: Publish release
        uses: pantry-pm/pantry/packages/action@v0.11.19
        with:
          install: 'false'
          release: 'true'
          release-files: |
            packages/cli/bin/system-cleaner-darwin-arm64.zip
          release-checksums: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
