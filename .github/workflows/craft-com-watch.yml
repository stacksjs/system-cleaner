# Notice if Craft ever stops initialising COM, before the Windows desktop app
# finds out the hard way.
#
# Craft's Windows runtime opens no window unless it puts the calling thread in
# a COM apartment: `launcher.ts` spawns it with `CREATE_NO_WINDOW`, which takes
# the console away, so `CreateCoreWebView2EnvironmentWithOptions` returns
# `CO_E_NOTINITIALIZED`. craft-native/craft@e2fc920f added the call and
# v0.0.166 was the first release to carry it; `MIN_WINDOWS_CRAFT` pins v0.0.175,
# the version the bundle was built and verified against.
#
# This watched for that fix arriving — it is what filed #24 and unblocked
# v0.3.8 — and now watches for it leaving. The regression guard in `ci.yml`
# cannot: it probes the pinned version, so it will stay green through any
# number of releases that drop the call, and the news would arrive as a dead
# window the first time anyone raised the floor.
#
# Daily, which is often enough for something that has to be acted on by hand
# and rare enough to cost nothing. A scheduled workflow stops running after 60
# days without repository activity, which for this repository means it stops
# when there is nothing to ship anyway.
name: Craft COM watch

on:
  schedule:
    # 07:17 UTC. Not on the hour: GitHub's scheduler queues more work there, and
    # a watcher has no reason to compete for it.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # To open the one issue, when there is something to open it about.
  issues: write

jobs:
  check:
    name: Does the newest Craft release still initialise COM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Reads the release's craft.exe and answers whether `CoInitializeEx` is
      # in its import table — proof by what the binary declares, needing no
      # Windows machine to run it.
      #
      # Green in the ordinary case, and green on a regression too: the issue it
      # opens is what has to be acted on, and it outlives a red run on a page
      # nobody opens. One issue per regressed release, named in its title, so
      # closing it is final — deduplicating on open issues alone is what filed
      # #25 the morning after #24 was closed.
      #
      # It fails only if it cannot trust its own answer: a craft.exe importing
      # nothing from ole32 at all, or a tag this script cannot read a version
      # out of, mean the parse or the archive changed rather than that Craft
      # regressed.
      - name: Check the import table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/craft-com-watch.ts --open-issue
