name: Desktop DMG

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dmg:
    name: Signed macOS installer
    runs-on: macos-15
    # Generous on purpose. A clean build is a few minutes, but it waits on
    # Apple's notary service, which has no stated upper bound and has taken
    # the better part of ten minutes before now. This is here to stop a hung
    # notarization holding a runner for six hours, not to police a slow one.
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pantry installs Craft and owns the temporary signing keychain.
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.199
        with:
          version: '0.11.199'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Dependencies
        run: bun install

      - name: Store notary credentials
        run: |
          xcrun notarytool store-credentials systemcleaner \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Build, sign, and notarize
        run: bun run build:app
        env:
          DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_SIGNING_IDENTITY_NAME }}
          NOTARY_PROFILE: systemcleaner

      - name: Require the notarized installer and manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          image="storage/framework/desktop-dmg/SystemCleaner-${version}.dmg"
          test -s "$image"
          test -s storage/framework/desktop-dmg/update.json
          xcrun stapler validate "$image"

      - name: Stage macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            storage/framework/desktop-dmg/*.dmg
            storage/framework/desktop-dmg/update.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep the size measurements
        uses: actions/upload-artifact@v4
        with:
          name: dmg-size-report
          path: storage/framework/desktop-dmg/size-report.json
          if-no-files-found: error
