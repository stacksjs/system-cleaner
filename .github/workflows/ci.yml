name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # Two generated inputs the suite reads straight off disk. Neither is
      # tracked, so a fresh checkout has neither, and five tests failed here on
      # every push for reasons that had nothing to do with the code under test.
      #
      # `public/app-menu.js` and `public/native-dialog.js` are bundled from
      # resources/scripts and gitignored — the client-scripts suite asserts
      # they exist, which is precisely a check that this step ran.
      - name: Build client scripts
        run: bun run build:scripts

      # `database/migrations` is derived from app/Models; bulk-delete.test.ts
      # applies it to a throwaway SQLite file in beforeAll and died with ENOENT
      # before a single case ran. Same missing step the desktop bundle build
      # had.
      - name: Generate migrations
        run: ./buddy migrate:regenerate --force

      - name: Unit Test
        run: bun test

  # Windows, for stacksjs/system-cleaner#23.
  #
  # Started non-blocking, as a spike: 293 pass / 11 fail on its first run. Four
  # of those were real defects - three in isPathSafe, where a backslash path
  # made the sensitive-segment scan match nothing and left ~/.ssh/id_rsa,
  # ~/.aws/credentials and ~/.gnupg/secring.gpg deletable - and seven were the
  # suite assuming POSIX. All fixed; it now passes 322/322, the same as macOS.
  #
  # Blocking from here. It is green, and it is the only leg that can catch a
  # path separator, a cmd.exe-vs-sh assumption, or the Windows file-locking
  # semantics that broke bulk-delete's teardown. Those crept in unnoticed for
  # the life of the project because nothing was looking.
  #
  # Note this does NOT mean the app works on Windows. Every capability flag is
  # still false; what passes here is the logic, not a feature.
  #
  # `shell: bash` throughout because `buddy` is a /bin/sh script and the runner
  # defaults to PowerShell; Git Bash ships on windows-latest.
  test-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Build client scripts
        run: bun run build:scripts

      - name: Generate migrations
        run: ./buddy migrate:regenerate --force

      # Printed before the suite so the log says what the app thinks it is even
      # when the tests below fall over.
      - name: What the app thinks it is running on
        run: |
          bun -e "
            const { PLATFORM, capabilities } = await import('./packages/core/src/platform.ts')
            console.log('platform:', PLATFORM)
            console.log('capabilities:', JSON.stringify(capabilities, null, 2))
          "

      # The platform layer is the part that is supposed to work here already.
      # If this fails, the foundation is wrong rather than merely incomplete.
      - name: Platform layer
        run: bun test tests/platform-support.test.ts

      - name: Full suite, for the record
        run: bun test --timeout 30000

      # The first actual .exe. Built here rather than cross-compiled from the
      # macOS release job, because `bun build --target=bun-windows-x64`
      # downloads a runtime matching the local bun and the release runner may
      # be ahead of the published stable.
      #
      # Not attached to a release. Four capabilities are implemented here now
      # (cleanTargets, diskScan, developerJunk, trash) and the rest refuse by
      # name, which is the point of building it: the binary proves the
      # toolchain and is honest about its gaps, instead of shipping something
      # that reports 0 B reclaimable and looks like a clean machine.
      - name: Build the Windows preview binary
        run: bun run build:binaries --preview --only windows --keep

      # A binary that compiles and then lies is worse than no binary. Assert it
      # runs, that a command this platform cannot carry out says which feature
      # is missing and exits non-zero, and that one it *can* carry out does.
      - name: Smoke-test it
        timeout-minutes: 5
        run: |
          set -e
          # --keep left the binary beside the archive, so there is nothing to
          # extract. Depending on `unzip` here would repeat the assumption that
          # made `zip` fail on this runner.
          cd packages/cli/bin
          exe=system-cleaner-windows-x64.exe
          test -f "$exe" || { echo "no .exe produced"; ls -la; exit 1; }

          echo "--- version ---"
          ./"$exe" --version

          # `optimize` needs `maintenance`, which has no Windows implementation.
          #
          # This used to run `clean`, chosen when every Windows capability was
          # false. Cleaning is implemented here now, so that assertion had CI
          # deleting files on the runner and then waiting on a confirmation
          # prompt with no TTY to answer it - the step hung for half an hour
          # before anyone looked. A smoke test must never pick a destructive
          # command to prove a refusal with.
          echo "--- a command this platform cannot carry out must refuse, not find nothing ---"
          if out=$(./"$exe" optimize 2>&1); then
            echo "FAIL: optimize exited 0 on a platform with no implementation"
            echo "$out"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -qi "not implemented on Windows" \
            || { echo "FAIL: refusal did not name the platform"; exit 1; }

          # And the other half, which the refusal test cannot show: a feature
          # that *is* implemented actually works in the compiled binary.
          # `disk` is read-only, is gated on `diskScan`, and measures through
          # the portable walker that replaced `du` - so this is the only place
          # in CI that proves the sizer runs inside an .exe.
          echo "--- an implemented, read-only command must work ---"
          mkdir -p smoke-probe
          # 256 KiB, so a sizer that reports zero cannot pass by rounding.
          head -c 262144 /dev/urandom > smoke-probe/blob.bin
          ./"$exe" disk smoke-probe --depth 1 --json > disk.json 2>&1 \
            || { echo "FAIL: disk exited non-zero"; cat disk.json; exit 1; }
          cat disk.json
          # Whitespace tolerated after the colon: the output is pretty-printed,
          # and the first version of this grep required none, so it would have
          # failed against perfectly good JSON.
          grep -qE '"sizeBytes" *:' disk.json \
            || { echo "FAIL: disk produced no sizes"; exit 1; }
          # A measurement of exactly zero is the failure this whole platform
          # effort is about: it renders as a clean machine. 256 KiB went in, so
          # anything starting with a zero here is the sizer not working.
          grep -qE '"totalSize" *: *[1-9]' disk.json \
            || { echo "FAIL: the probe measured zero bytes"; exit 1; }

      - name: Keep the binary for inspection
        uses: actions/upload-artifact@v4
        with:
          name: system-cleaner-windows-x64
          path: packages/cli/bin/system-cleaner-windows-x64.zip
          if-no-files-found: error

      # The desktop bundle, built on Windows because the icon and the
      # version-info resource need the Windows resource compiler - a
      # cross-build from macOS produces a working but anonymous .exe:
      #
      #     error: Using --windows-icon is only available when compiling on Windows
      - name: Build the Windows desktop bundle
        run: bun run build:app:windows

      # What can be checked without a human looking at a window.
      #
      # Runs the launcher's own `agent` subcommand with the environment the
      # launcher passes it, then asks the health endpoint. That exercises the
      # compiled binary, the argv dispatch, the view payload, the migrations
      # and the loopback bind - everything except the window itself, which
      # needs eyes or a screenshot harness.
      - name: Smoke-test the desktop agent
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "storage/framework/desktop-windows/SystemCleaner"
          $exe = Join-Path $stage "SystemCleaner.exe"
          if (-not (Test-Path $exe)) { throw "no launcher at $exe" }

          # The launcher is a GUI-subsystem binary, which is what keeps a
          # command prompt from opening beside the app. Assert it, because the
          # flag that does it is easy to drop and the symptom is cosmetic
          # enough to ship unnoticed.
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem: $subsystem (2 = GUI, 3 = console)"
          if ($subsystem -ne 2) { throw "launcher is not a GUI subsystem binary; --windows-hide-console was lost" }

          $data = Join-Path $env:RUNNER_TEMP "sc-desktop-smoke"
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          $env:SYSTEM_CLEANER_AGENT = '1'
          $env:SYSTEM_CLEANER_WEB_ROOT = (Resolve-Path (Join-Path $stage "resources/web")).Path
          $env:SYSTEM_CLEANER_MIGRATIONS = (Resolve-Path (Join-Path $stage "resources/migrations")).Path
          $env:SYSTEM_CLEANER_PORT = '39477'
          $env:DB_CONNECTION = 'sqlite'
          $env:DB_DATABASE_PATH = (Join-Path $data "system-cleaner.sqlite")
          $env:APP_ENV = 'production'

          $log = Join-Path $data "agent.log"
          $agent = Start-Process -FilePath $exe -ArgumentList 'agent' -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError (Join-Path $data "agent.err") -NoNewWindow

          try {
            $ok = $false
            foreach ($attempt in 1..60) {
              Start-Sleep -Milliseconds 500
              try {
                $res = Invoke-WebRequest -Uri "http://127.0.0.1:39477/__health" -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }

            Write-Host "--- agent stdout ---"; if (Test-Path $log) { Get-Content $log }
            Write-Host "--- agent stderr ---"; Get-Content (Join-Path $data "agent.err") -ErrorAction SilentlyContinue

            if (-not $ok) { throw "the desktop agent never answered /__health" }
            Write-Host "the desktop agent answered /__health"

            # And it serves the bundled UI, not just the API - a bundle whose
            # web payload never reached it would still pass the check above.
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:39477/app" -UseBasicParsing -TimeoutSec 5
            if ($page.StatusCode -ne 200) { throw "/app returned $($page.StatusCode)" }
            Write-Host "/app served $($page.RawContentLength) bytes"
          }
          finally {
            if ($agent -and -not $agent.HasExited) { Stop-Process -Id $agent.Id -Force }
          }

      - name: Keep the desktop bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: SystemCleaner-windows-desktop
          path: storage/framework/desktop-windows/*.zip
          if-no-files-found: error

  # Compiles the release artifact on every push so a broken CLI is caught here
  # rather than after a tag has already been pushed.
  binaries:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build binaries
        run: bun run build:binaries

  publish-commit:
    needs: [lint, typecheck, test, binaries]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@v0.11.74

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit './packages/*'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
